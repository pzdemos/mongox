<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongoDB Admin Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <header class="topbar">
      <div>
        <h1>MongoDB Admin Web</h1>
        <p>本地/远程连接、CRUD、查询多视图、结果多格式导出</p>
      </div>
      <div id="statusChip" class="status-chip">未连接</div>
    </header>

    <main class="layout">
      <aside class="panel side-panel">
        <section class="block">
          <div class="block-title-row">
            <h2>连接</h2>
            <button
              id="connectToggleBtn"
              type="button"
              class="icon-toggle-btn connection-toggle-btn"
              aria-label="连接数据库"
              title="连接数据库"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M10 7V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M3 12h12M9 8l4 4-4 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <form id="connectForm" class="connect-form">
            <label for="uriInput">连接字符串</label>
            <input
              id="uriInput"
              type="text"
              placeholder="mongodb://127.0.0.1:27017"
              value="mongodb://127.0.0.1:27017"
            />
          </form>
        </section>

        <section class="block">
          <div class="block-title-row">
            <h2>数据库</h2>
            <button
              id="refreshDbBtn"
              type="button"
              class="icon-refresh-btn"
              aria-label="刷新数据库列表"
              title="刷新数据库列表"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="combo-picker">
            <div class="combo-field">
              <input
                id="dbComboInput"
                type="text"
                autocomplete="off"
                placeholder="输入或选择数据库名，例如: app_prod"
              />
              <button
                id="dbComboToggleBtn"
                type="button"
                class="combo-toggle-btn"
                aria-label="展开数据库选项"
                title="展开数据库选项"
              >
                <span aria-hidden="true">▾</span>
              </button>
              <div id="dbComboMenu" class="combo-menu" role="listbox" hidden></div>
            </div>
            <button id="setDbBtn" type="button" class="combo-apply-btn">应用</button>
          </div>
        </section>

        <section class="block">
          <div class="block-title-row">
            <h2>集合</h2>
            <button
              id="refreshCollectionBtn"
              type="button"
              class="icon-refresh-btn"
              aria-label="刷新集合列表"
              title="刷新集合列表"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="combo-picker">
            <div class="combo-field">
              <input
                id="collectionComboInput"
                type="text"
                autocomplete="off"
                placeholder="输入或选择集合名，例如: users"
              />
              <button
                id="collectionComboToggleBtn"
                type="button"
                class="combo-toggle-btn"
                aria-label="展开集合选项"
                title="展开集合选项"
              >
                <span aria-hidden="true">▾</span>
              </button>
              <div id="collectionComboMenu" class="combo-menu" role="listbox" hidden></div>
            </div>
            <button id="setCollectionBtn" type="button" class="combo-apply-btn">应用</button>
          </div>
        </section>

        <section class="block">
          <h2>状态</h2>
          <pre id="statusText" class="code"></pre>
        </section>
      </aside>

      <section class="panel main-panel">
        <div class="tabbar">
          <button class="tab active" data-tab="query">查询</button>
          <button class="tab" data-tab="insert">新增</button>
          <button class="tab" data-tab="update">更新</button>
          <button class="tab" data-tab="delete">删除</button>
          <button class="tab" data-tab="stats">统计</button>
        </div>

        <section id="tab-query" class="tab-content active">
          <div class="grid-2">
            <label>
              Filter (JSON/EJSON)
              <textarea id="queryFilter" rows="5">{}</textarea>
            </label>
            <label>
              Projection (JSON/EJSON, 可选)
              <textarea id="queryProjection" rows="5"></textarea>
            </label>
          </div>
          <div class="grid-2">
            <label>
              Sort (JSON/EJSON, 可选)
              <textarea id="querySort" rows="3"></textarea>
            </label>
            <label>
              Limit
              <input id="queryLimit" type="number" min="1" max="500" value="20" />
            </label>
          </div>
          <div class="row">
            <button id="runQueryBtn" type="button">执行查询</button>
            <select id="viewMode">
              <option value="table">表格视图</option>
              <option value="json">JSON 视图</option>
              <option value="cards">卡片视图</option>
            </select>
            <select id="exportFormat">
              <option value="json">导出 JSON</option>
              <option value="yaml">导出 YAML</option>
              <option value="csv">导出 CSV</option>
              <option value="ndjson">导出 NDJSON</option>
            </select>
            <button id="exportBtn" type="button" class="ghost">导出当前查询</button>
          </div>
          <div id="resultsMeta" class="meta"></div>
          <div id="resultsContainer" class="results"></div>
        </section>

        <section id="tab-insert" class="tab-content">
          <label>
            Document (JSON/EJSON)
            <textarea id="insertDoc" rows="14">{
  "name": "demo",
  "createdAt": {"$date":"2026-01-01T00:00:00Z"}
}</textarea>
          </label>
          <div class="row">
            <button id="insertBtn" type="button">插入文档</button>
          </div>
        </section>

        <section id="tab-update" class="tab-content">
          <div class="grid-2">
            <label>
              Filter (JSON/EJSON)
              <textarea id="updateFilter" rows="6">{}</textarea>
            </label>
            <label>
              Update (JSON/EJSON)
              <textarea id="updateDoc" rows="6">{
  "$set": {
    "updatedAt": {"$date":"2026-01-01T00:00:00Z"}
  }
}</textarea>
            </label>
          </div>
          <div class="row">
            <label class="inline"><input id="updateMany" type="checkbox" /> updateMany</label>
            <label class="inline"><input id="updateUpsert" type="checkbox" /> upsert</label>
            <button id="updateBtn" type="button">执行更新</button>
          </div>
        </section>

        <section id="tab-delete" class="tab-content">
          <label>
            Filter (JSON/EJSON)
            <textarea id="deleteFilter" rows="8">{}</textarea>
          </label>
          <div class="row">
            <label class="inline"><input id="deleteMany" type="checkbox" /> deleteMany</label>
            <button id="deleteBtn" type="button" class="danger">执行删除</button>
          </div>
        </section>

        <section id="tab-stats" class="tab-content">
          <div class="row">
            <button id="statsBtn" type="button">刷新统计</button>
          </div>
          <pre id="statsOutput" class="code"></pre>
        </section>
      </section>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
