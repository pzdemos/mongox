<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongoDB Admin Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <main class="layout">
      <aside class="panel side-panel" id="sidePanel">
        <div class="sidebar-toolbar">
          <div class="sidebar-brand" aria-label="应用标题">Mongo Atelier</div>
        </div>
        <div class="side-panel-content">
        <section class="block">
          <form id="connectForm" class="connect-form">
            <div class="connect-row">
              <input
                id="uriInput"
                type="text"
                placeholder="mongodb://127.0.0.1:16016"
                value="mongodb://127.0.0.1:16016"
              />
              <button
                id="connectToggleBtn"
                type="button"
                class="icon-toggle-btn connection-toggle-btn"
                aria-label="连接数据库"
                title="连接数据库"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M10 7V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 12h12M9 8l4 4-4 4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </form>
        </section>

        <section class="block tree-block">
          <div class="block-title-row">
            <h2>数据库</h2>
            <button
              id="refreshDbBtn"
              type="button"
              class="icon-refresh-btn"
              aria-label="刷新"
              title="刷新"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div id="dbTree" class="tree-list"></div>
        </section>
        </div>
      </aside>

      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

      <section class="panel main-panel">
        <div class="main-topbar">
          <button
            id="sidebarToggleBtn"
            type="button"
            class="icon-toggle-btn main-collapse-btn"
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 18l-6-6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div id="queryModeSwitcher" class="query-input-switch">
            <button
              id="queryBuilderModeBtn"
              type="button"
              class="query-mode-btn active"
              data-mode="builder"
            >
              条件模式
            </button>
            <button id="queryTerminalModeBtn" type="button" class="query-mode-btn" data-mode="terminal">
              命令模式
            </button>
          </div>
          <div id="statusChip" class="status-chip">未连接</div>
        </div>

        <div class="tabbar operation-tabbar">
          <button class="tab active" data-tab="query">查询</button>
          <button class="tab" data-tab="insert">新增</button>
          <button class="tab" data-tab="update">更新</button>
          <button class="tab" data-tab="delete">删除</button>
          <button class="tab" data-tab="stats">统计</button>
        </div>

        <section id="tab-query" class="tab-content active">
          <section id="queryTerminalPanel" class="terminal-panel" hidden>
            <div class="terminal-head">
              <button
                id="terminalCollapseBtn"
                type="button"
                class="panel-collapse-btn"
                aria-label="折叠查询输入区"
                title="折叠查询输入区"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M18 15l-6-6-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <div class="terminal-tab">mongosh</div>
              <div id="terminalContext" class="terminal-context">未连接</div>
              <div class="terminal-head-actions">
                <div id="terminalCornerHost" class="query-corner-host"></div>
                <button id="terminalClearBtn" type="button" class="terminal-clear-btn">清空</button>
              </div>
            </div>
            <div id="terminalOutput" class="terminal-output">
              <div class="terminal-entry terminal-entry-hint">
                输入命令执行 CRUD，例如: db.getCollection('users').find({})
              </div>
            </div>
            <div class="terminal-input-row">
              <span id="terminalPrompt" class="terminal-prompt">db.(collection)&gt;</span>
              <input
                id="terminalInput"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="db.getCollection('temp').find({})"
              />
              <button id="terminalRunBtn" type="button">执行</button>
            </div>
          </section>
          <div id="queryBuilderPanel" class="query-builder-card">
            <button
              id="builderCollapseBtn"
              type="button"
              class="panel-collapse-btn"
              aria-label="折叠查询输入区"
              title="折叠查询输入区"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M18 15l-6-6-6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div id="builderCornerHost" class="query-corner-host"></div>
            <div class="grid-2">
              <label>
                Filter (JSON/EJSON)
                <textarea id="queryFilter" rows="5">{}</textarea>
              </label>
              <label>
                Projection (JSON/EJSON, 可选)
                <textarea id="queryProjection" rows="5"></textarea>
              </label>
            </div>
            <div class="grid-2">
              <label>
                Sort (JSON/EJSON, 可选)
                <textarea id="querySort" rows="3"></textarea>
              </label>
              <label>
                Limit
                <input id="queryLimit" type="number" min="1" max="500" value="20" />
              </label>
            </div>
            <div class="query-toolbar">
              <div class="query-primary-actions">
                <button id="runQueryBtn" type="button">执行查询</button>
              </div>
            </div>
          </div>

          <div id="queryCornerControls" class="query-corner-controls" hidden>
            <div id="viewModePicker" class="theme-select corner-select">
              <button
                id="viewModeBtn"
                type="button"
                class="theme-select-btn"
                data-prefix="视图"
                aria-expanded="false"
                aria-haspopup="listbox"
                title="切换结果视图"
              >
                <span class="theme-select-btn-label">视图 · 表格</span>
                <span class="theme-select-toggle" aria-hidden="true">▾</span>
              </button>
              <div id="viewModeMenu" class="theme-select-menu" role="listbox" hidden>
                <button type="button" class="theme-select-option active" data-value="table">表格</button>
                <button type="button" class="theme-select-option" data-value="json">JSON</button>
                <button type="button" class="theme-select-option" data-value="cards">卡片</button>
              </div>
              <input id="viewMode" type="hidden" value="table" />
            </div>
            <div id="exportFormatPicker" class="theme-select corner-select">
              <button
                id="exportFormatBtn"
                type="button"
                class="theme-select-btn"
                data-prefix="导出"
                aria-expanded="false"
                aria-haspopup="listbox"
                title="切换导出格式"
              >
                <span class="theme-select-btn-label">导出 · JSON</span>
                <span class="theme-select-toggle" aria-hidden="true">▾</span>
              </button>
              <div id="exportFormatMenu" class="theme-select-menu" role="listbox" hidden>
                <button type="button" class="theme-select-option active" data-value="json">JSON</button>
                <button type="button" class="theme-select-option" data-value="yaml">YAML</button>
                <button type="button" class="theme-select-option" data-value="csv">CSV</button>
                <button type="button" class="theme-select-option" data-value="ndjson">NDJSON</button>
              </div>
              <input id="exportFormat" type="hidden" value="json" />
            </div>
            <button id="exportBtn" type="button" class="corner-export-btn" title="导出结果">
              导出
            </button>
          </div>
          <div id="resultsMeta" class="meta"></div>
          <div id="resultsContainer" class="results"></div>
        </section>

        <section id="tab-insert" class="tab-content">
          <label>
            Document (JSON/EJSON)
            <textarea id="insertDoc" rows="14">{
  "name": "demo",
  "createdAt": {"$date":"2026-01-01T00:00:00Z"}
}</textarea>
          </label>
          <div class="row">
            <button id="insertBtn" type="button">插入文档</button>
          </div>
        </section>

        <section id="tab-update" class="tab-content">
          <div class="grid-2">
            <label>
              Filter (JSON/EJSON)
              <textarea id="updateFilter" rows="6">{}</textarea>
            </label>
            <label>
              Update (JSON/EJSON)
              <textarea id="updateDoc" rows="6">{
  "$set": {
    "updatedAt": {"$date":"2026-01-01T00:00:00Z"}
  }
}</textarea>
            </label>
          </div>
          <div class="row">
            <label class="inline"><input id="updateMany" type="checkbox" /> updateMany</label>
            <label class="inline"><input id="updateUpsert" type="checkbox" /> upsert</label>
            <button id="updateBtn" type="button">执行更新</button>
          </div>
        </section>

        <section id="tab-delete" class="tab-content">
          <label>
            Filter (JSON/EJSON)
            <textarea id="deleteFilter" rows="8">{}</textarea>
          </label>
          <div class="row">
            <label class="inline"><input id="deleteMany" type="checkbox" /> deleteMany</label>
            <button id="deleteBtn" type="button" class="danger">执行删除</button>
          </div>
        </section>

        <section id="tab-stats" class="tab-content">
          <div class="row">
            <button id="statsBtn" type="button">刷新统计</button>
          </div>
          <pre id="statsOutput" class="code"></pre>
        </section>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="deletePopover" class="delete-popover" hidden>
      <div class="delete-popover-body">
        <p>确认删除该文档？</p>
        <pre id="deleteDocId" class="delete-popover-id"></pre>
      </div>
      <div class="delete-popover-actions">
        <button id="deleteCancelBtn" type="button" class="ghost">取消</button>
        <button id="deleteConfirmBtn" type="button" class="danger">删除</button>
      </div>
    </div>

    <div id="indexContextMenu" class="context-menu" hidden>
      <div class="context-menu-header">
        <span id="indexContextMenuTitle">索引</span>
        <button id="indexContextMenuClose" type="button" class="context-menu-close-btn">&times;</button>
      </div>
      <div id="indexContextMenuBody" class="context-menu-body"></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
