<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · Mongo Atelier</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) * 1.5);
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }
      .login-brand {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }
      .login-hint {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .login-form label {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .login-form input[type="password"] {
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        outline: none;
        transition: border-color 0.15s;
      }
      .login-form input[type="password"]:focus {
        border-color: var(--brand);
        background: var(--panel);
      }
      .login-submit {
        margin-top: 8px;
        padding: 10px 16px;
        font-size: 14px;
        color: #fff;
        background: var(--brand);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.15s;
      }
      .login-submit:hover {
        background: var(--brand-2);
      }
      .login-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .login-error {
        min-height: 18px;
        font-size: 13px;
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">Mongo Atelier</div>
        <div class="login-hint">请输入访问密码</div>
        <form id="loginForm" class="login-form" autocomplete="on">
          <label>
            密码
            <input id="passwordInput" type="password" name="password" autofocus required />
          </label>
          <button type="submit" class="login-submit" id="loginSubmitBtn">进入</button>
          <div id="loginError" class="login-error"></div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const passwordInput = document.getElementById("passwordInput");
      const submitBtn = document.getElementById("loginSubmitBtn");
      const errorEl = document.getElementById("loginError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        submitBtn.disabled = true;
        submitBtn.textContent = "验证中...";
        try {
          const response = await fetch("/mongo/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok && data.ok) {
            location.href = "/";
            return;
          }
          errorEl.textContent = data.error || `登录失败 (${response.status})`;
        } catch (err) {
          errorEl.textContent = "网络错误，请重试";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "进入";
        }
      });
    </script>
  </body>
</html>
